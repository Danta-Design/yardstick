name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -euo pipefail
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md \
                   docs/architecture.md docs/metrics.md docs/issues.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "documentation layout OK"

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: docs
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/cli/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # TODO(EV-31): add a docker compose smoke test once server/ exists.
